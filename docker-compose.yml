# ==============================================================================
# OenGo Merchant Store & Menu Service — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oengo-merchant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oengo-merchant-standalone
    ports:
      - "3012:3012"
    environment:
      PORT: "3012"
      NODE_ENV: production
      OENGO_API_URL: ${OENGO_API_URL:-http://localhost:3001}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3012/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
